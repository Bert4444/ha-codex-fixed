name: HA Codex
description: Before starting, select the Codex model you want in App Configuration. Optionally enable controlled Home Assistant reload and restart actions. Use Codex in a Home Assistant sidebar workspace to review and edit your configuration.
version: "0.1.26"
slug: home_assistant_codex_app
url: https://github.com/ambient-home-systems/ha-codex
arch:
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 7681
ingress_stream: true
homeassistant_api: true
panel_icon: mdi:robot-outline
panel_title: HA Codex
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: addon_config
    read_only: false
    path: /config
options:
  model: gpt-5.6-terra
  terminal_font_size: 14
  terminal_scrollback: 10000
  terminal_theme: dark
  session_persistence: true
  preserve_terminal_history: true
  home_assistant_control: false
  allow_home_assistant_restart: false
schema:
  model: list(gpt-5.6-terra|gpt-5.6-sol|gpt-5.6-luna|gpt-5.6|gpt-5.5|gpt-5.4|gpt-5.4-mini|gpt-5.3-codex-spark)
  terminal_font_size: int(10,24)
  terminal_scrollback: int(1000,50000)
  terminal_theme: list(dark|light)
  session_persistence: bool
  preserve_terminal_history: bool
  home_assistant_control: bool
  allow_home_assistant_restart: bool
