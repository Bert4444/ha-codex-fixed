name: HA Codex
description: Use Codex in a Home Assistant sidebar workspace to review and edit your configuration.
version: "0.1.9"
slug: home_assistant_codex_app
url: https://github.com/ambient-home-systems/ha-codex
arch:
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:robot-outline
panel_title: HA Codex
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: addon_config
    read_only: false
    path: /config
options:
  model: gpt-5.6-terra
  terminal_font_size: 14
  terminal_scrollback: 20000
  terminal_theme: dark
  session_persistence: true
schema:
  model: list(gpt-5.6-terra|gpt-5.6-sol)
  terminal_font_size: int(10,24)
  terminal_scrollback: int(1000,50000)
  terminal_theme: list(dark|light)
  session_persistence: bool
