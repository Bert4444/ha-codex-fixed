<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Recommended HA Codex device login</title>
  <desc id="desc">Illustrated terminal showing the Login on another device option, followed by a phone displaying a device code.</desc>
  <rect width="1200" height="675" fill="#111827"/>
  <text x="72" y="76" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Recommended: complete sign-in on another device</text>
  <rect x="72" y="120" width="645" height="470" rx="16" fill="#0b1020" stroke="#2b3852" stroke-width="2"/>
  <rect x="72" y="120" width="645" height="48" rx="16" fill="#182238"/>
  <circle cx="104" cy="144" r="7" fill="#ff6b6b"/><circle cx="128" cy="144" r="7" fill="#ffd166"/><circle cx="152" cy="144" r="7" fill="#2bd576"/>
  <g font-family="Menlo, Consolas, monospace" font-size="19">
    <text x="111" y="224" fill="#dcecff">Sign in to Codex</text>
    <text x="111" y="274" fill="#b9c4d4">1. Sign in in this browser</text>
    <rect x="98" y="300" width="546" height="68" rx="10" fill="#1f3f51" stroke="#18c7c5" stroke-width="2"/>
    <text x="121" y="342" fill="#8be7e4">2. Log in with a different device  ← recommended</text>
    <text x="111" y="423" fill="#b9c4d4">Codex displays a secure link and a one-time code.</text>
    <text x="111" y="462" fill="#b9c4d4">Open the link on your phone or computer,</text>
    <text x="111" y="495" fill="#b9c4d4">then return here when it says you are signed in.</text>
  </g>
  <path d="M763 344h114" stroke="#18c7c5" stroke-width="6" stroke-linecap="round"/><path d="M853 317l32 27-32 27" fill="none" stroke="#18c7c5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="904" y="184" width="206" height="391" rx="27" fill="#dcecff" stroke="#0b1f4d" stroke-width="12"/>
  <rect x="925" y="229" width="164" height="290" rx="10" fill="#f8fafc"/>
  <circle cx="1007" cy="547" r="10" fill="#0b1f4d"/>
  <text x="947" y="272" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0b1f4d">OpenAI sign-in</text>
  <text x="952" y="329" font-family="Arial, sans-serif" font-size="14" fill="#334155">Enter this code</text>
  <rect x="947" y="353" width="120" height="50" rx="8" fill="#0b1f4d"/>
  <text x="969" y="385" font-family="Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#8be7e4">••••••</text>
  <text x="950" y="449" font-family="Arial, sans-serif" font-size="13" fill="#334155">Use your ChatGPT account.</text>
  <text x="950" y="472" font-family="Arial, sans-serif" font-size="13" fill="#334155">The code is one-time and expires.</text>
</svg>
